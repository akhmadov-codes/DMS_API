{% extends "admin/base.html" %} {% block extrahead %} {{ block.super }}
<script>
    // Sahifa yuklanishidan OLDIN dark mode ni qo'llash
    (function () {
        var theme = localStorage.getItem("django-admin-theme");
        if (theme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            // Sahifa yuklanishining eng boshida asosiy dark mode ranglarini qo'llash
            document.documentElement.style.backgroundColor =
                "#121212"; /* Kunning fon rangi */
            document.body.style.backgroundColor =
                "#121212"; /* Tananing fon rangi */
            document.body.style.color = "#e0e0e0"; /* Matn rangi */
        }
    })();
</script>

<style>
    /* Miltillashni kamaytirish va dark mode uslublari */
    html[data-theme="dark"] {
        color-scheme: dark;
        /* Faqat JS ishlamaydigan holatda zaxira sifatida */
        background-color: #121212;
        color: #e0e0e0;
    }
    html[data-theme="dark"] body {
        background-color: #121212;
        color: #e0e0e0;
    }
    * {
        /* Barcha elementlar uchun o'tishlarni o'chirish */
        transition: none !important;
    }
</style>
{% endblock %}
